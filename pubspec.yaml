name: rooted
description: "Rooted — a Pomodoro study app with a plant that grows or wilts with you."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2       # simple state management (ChangeNotifier)
  shared_preferences: ^2.2.3  # local storage for streak / sessions / plant progress
  google_fonts: ^6.2.1   # for the pixel-style heading font
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Flutter only includes files directly inside a listed folder (not
  # subfolders), so both of these need to be listed separately.
  assets:
    - assets/images/plant/stages/
    - assets/images/plant/frames/
    - assets/images/plant/wilted/
    - assets/images/backgrounds/
    - assets/images/buttons/
    - assets/images/popups/
    # Extra collectible plants (made by tool/generate_plants.dart)
    - assets/images/plants/desert_cactus/stages/
    - assets/images/plants/desert_cactus/frames/
    - assets/images/plants/desert_cactus/wilted/
    - assets/images/plants/forest_fern/stages/
    - assets/images/plants/forest_fern/frames/
    - assets/images/plants/forest_fern/wilted/
    - assets/images/plants/moonpetal_lily/stages/
    - assets/images/plants/moonpetal_lily/frames/
    - assets/images/plants/moonpetal_lily/wilted/
    - assets/images/plants/phoenix_bloom/stages/
    - assets/images/plants/phoenix_bloom/frames/
    - assets/images/plants/phoenix_bloom/wilted/
    - assets/images/plants/crystal_lotus/stages/
    - assets/images/plants/crystal_lotus/frames/
    - assets/images/plants/crystal_lotus/wilted/
    - assets/images/plants/glory_tree/stages/
    - assets/images/plants/glory_tree/frames/
    - assets/images/plants/glory_tree/wilted/

# ---------------------------------------------------------------------------
# App icon. Art lives in assets/icon/ (made by tool/generate_icon.dart —
# or drop in your own files with the same names). After changing it run:
#   dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: false # this project has no ios/ folder
  image_path: "assets/icon/app_icon.png"
  # Android 8+ "adaptive" icon: the launcher crops it to a circle/squircle.
  adaptive_icon_background: "#DCEFC8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ---------------------------------------------------------------------------
# Launch splash: what the phone shows the instant the app is opened — the
# kuwaGO lockup (kuwago perched on the clock O) on leaf green.
#   Android 12+: ANIMATED (the minute hand winds a lap, kuwago bobs) —
#                made by tool/generate_splash_anim.dart.
#   Older:       the same picture, still.
# The opening (lib/widgets/clock_intro.dart) then carries on from the
# exact same frame. After changing anything here, run BOTH, in order:
#   dart run flutter_native_splash:create
#   dart run tool/generate_splash_anim.dart
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#DCEFC8"
  image: assets/icon/splash_lockup.png
  android_12:
    color: "#DCEFC8"
    image: assets/icon/splash_lockup.png
  web: false
